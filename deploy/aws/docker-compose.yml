services:
  api:
    build:
      context: ../..
      dockerfile: deploy/aws/Dockerfile
    restart: unless-stopped
    env_file: /opt/celsyn/runtime.env
    environment:
      PORT: 5000
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  simulator:
    build:
      context: ../..
      dockerfile: deploy/aws/Dockerfile
    restart: unless-stopped
    env_file: /opt/celsyn/runtime.env
    environment:
      SIMULATOR_BACKEND_URL: http://api:5000
    command: ["npm", "run", "simulate", "--", "--trucks=25", "--interval=500"]
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
