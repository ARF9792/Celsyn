<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title description">
  <title id="title">Celsyn system architecture</title>
  <desc id="description">A detailed architecture diagram showing simulated refrigerated vehicles, the Express ingestion edge, telemetry processing, MongoDB persistence, Socket.IO delivery, and the React operations workspace.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b0e"/>
      <stop offset="1" stop-color="#111821"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#83a7d8"/>
      <stop offset="1" stop-color="#b9d6f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8494aa"/>
    </marker>
    <style>
      .eyebrow{font:500 16px Geist,Arial,sans-serif;letter-spacing:.12em;fill:#8c9aae}
      .title{font:500 48px Geist,Arial,sans-serif;letter-spacing:-.035em;fill:#f1f3f6}
      .subtitle{font:400 18px Geist,Arial,sans-serif;fill:#9da7b5}
      .lane{fill:#10151c;stroke:#25303d;stroke-width:1.5}
      .lane-title{font:500 16px Geist,Arial,sans-serif;fill:#c2cad5}
      .card{fill:#151b23;stroke:#303b49;stroke-width:1.5;filter:url(#shadow)}
      .card-accent{fill:#162333;stroke:#557ca8;stroke-width:1.5;filter:url(#shadow)}
      .card-store{fill:#171e20;stroke:#45645a;stroke-width:1.5;filter:url(#shadow)}
      .card-title{font:500 20px Geist,Arial,sans-serif;fill:#f0f2f5}
      .card-copy{font:400 14px Geist,Arial,sans-serif;fill:#9ba6b5}
      .small{font:400 13px Geist Mono,monospace;fill:#7f8c9e}
      .flow{fill:none;stroke:#8494aa;stroke-width:2;marker-end:url(#arrow)}
      .flow-hot{fill:none;stroke:#86aedc;stroke-width:2.5;marker-end:url(#arrow)}
      .flow-store{fill:none;stroke:#78a292;stroke-width:2.5;marker-end:url(#arrow)}
      .flow-dash{fill:none;stroke:#617083;stroke-width:1.75;stroke-dasharray:8 8;marker-end:url(#arrow)}
      .flow-label{font:500 12px Geist Mono,monospace;fill:#8f9bae}
      .tag{fill:#1e2834;stroke:#354254}
      .tag-text{font:500 12px Geist,Arial,sans-serif;fill:#b9c5d4}
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#background)"/>
  <circle cx="1320" cy="90" r="260" fill="#5e8fc8" opacity=".06"/>
  <circle cx="260" cy="890" r="300" fill="#7bb197" opacity=".045"/>

  <text x="72" y="70" class="eyebrow">CELSYN · REAL-TIME COLD-CHAIN OPERATIONS</text>
  <text x="72" y="124" class="title">System architecture</text>
  <text x="72" y="158" class="subtitle">Telemetry is captured durably, evaluated deterministically, and delivered selectively to authenticated operators.</text>

  <g transform="translate(72 210)">
    <rect class="lane" width="250" height="680" rx="20"/>
    <text x="24" y="38" class="lane-title">1 · Telemetry sources</text>
    <g transform="translate(24 72)">
      <rect class="card" width="202" height="132" rx="14"/>
      <text x="18" y="34" class="card-title">Fleet simulator</text>
      <text x="18" y="60" class="card-copy">Stateful vehicle movement,</text>
      <text x="18" y="81" class="card-copy">cargo temperature, fuel, door</text>
      <text x="18" y="102" class="card-copy">and reefer telemetry.</text>
    </g>
    <g transform="translate(24 228)">
      <rect class="card" width="202" height="132" rx="14"/>
      <text x="18" y="34" class="card-title">Device adapters</text>
      <text x="18" y="60" class="card-copy">Production extension point for</text>
      <text x="18" y="81" class="card-copy">telematics gateways, sensors</text>
      <text x="18" y="102" class="card-copy">or partner integrations.</text>
    </g>
    <g transform="translate(24 408)">
      <rect class="card" width="202" height="188" rx="14"/>
      <text x="18" y="34" class="card-title">Event contract</text>
      <text x="18" y="64" class="small">eventId · sequence</text>
      <text x="18" y="88" class="small">truckId · timestamp</text>
      <text x="18" y="112" class="small">location · temperature</text>
      <text x="18" y="136" class="small">humidity · speed · fuel</text>
      <text x="18" y="160" class="small">door · reefer</text>
    </g>
  </g>

  <g transform="translate(350 210)">
    <rect class="lane" width="278" height="680" rx="20"/>
    <text x="24" y="38" class="lane-title">2 · API and validation edge</text>
    <g transform="translate(24 72)">
      <rect class="card-accent" width="230" height="132" rx="14"/>
      <text x="18" y="34" class="card-title">Express REST API</text>
      <text x="18" y="60" class="card-copy">Single and batched ingestion,</text>
      <text x="18" y="81" class="card-copy">fleet reads, history, compliance,</text>
      <text x="18" y="102" class="card-copy">alerts and system metrics.</text>
    </g>
    <g transform="translate(24 228)">
      <rect class="card" width="230" height="132" rx="14"/>
      <text x="18" y="34" class="card-title">Trust boundary</text>
      <text x="18" y="60" class="card-copy">Zod schemas, registered-truck</text>
      <text x="18" y="81" class="card-copy">checks, stale sequence rejection</text>
      <text x="18" y="102" class="card-copy">and ingestion rate limiting.</text>
    </g>
    <g transform="translate(24 384)">
      <rect class="card" width="230" height="132" rx="14"/>
      <text x="18" y="34" class="card-title">Authentication</text>
      <text x="18" y="60" class="card-copy">JWT protects dashboard REST</text>
      <text x="18" y="81" class="card-copy">requests and the Socket.IO</text>
      <text x="18" y="102" class="card-copy">handshake.</text>
    </g>
    <g transform="translate(24 552)">
      <rect class="tag" width="112" height="34" rx="17"/><text x="18" y="22" class="tag-text">HTTP + JSON</text>
      <rect class="tag" x="122" width="108" height="34" rx="17"/><text x="141" y="22" class="tag-text">JWT bearer</text>
    </g>
  </g>

  <g transform="translate(656 210)">
    <rect class="lane" width="366" height="680" rx="20"/>
    <text x="24" y="38" class="lane-title">3 · Real-time processing core</text>
    <g transform="translate(24 72)">
      <rect class="card-accent" width="318" height="118" rx="14"/>
      <text x="18" y="34" class="card-title">Telemetry processor</text>
      <text x="18" y="61" class="card-copy">Accepts validated events, advances the latest</text>
      <text x="18" y="82" class="card-copy">state and fans work into independent paths.</text>
    </g>
    <g transform="translate(24 214)">
      <rect class="card" width="150" height="118" rx="14"/>
      <text x="16" y="34" class="card-title">Latest state</text>
      <text x="16" y="60" class="card-copy">In-memory Map</text>
      <text x="16" y="81" class="card-copy">for fleet reads.</text>
    </g>
    <g transform="translate(192 214)">
      <rect class="card" width="150" height="118" rx="14"/>
      <text x="16" y="34" class="card-title">Detection</text>
      <text x="16" y="60" class="card-copy">Deterministic rules</text>
      <text x="16" y="81" class="card-copy">with cooldowns.</text>
    </g>
    <g transform="translate(24 356)">
      <rect class="card-store" width="150" height="138" rx="14"/>
      <text x="16" y="34" class="card-title">Write buffer</text>
      <text x="16" y="60" class="card-copy">400 ms or</text>
      <text x="16" y="81" class="card-copy">500 events.</text>
      <text x="16" y="112" class="small">insertMany</text>
    </g>
    <g transform="translate(192 356)">
      <rect class="card-accent" width="150" height="138" rx="14"/>
      <text x="16" y="34" class="card-title">Scheduler</text>
      <text x="16" y="60" class="card-copy">Newest changed</text>
      <text x="16" y="81" class="card-copy">state per truck.</text>
      <text x="16" y="112" class="small">150 ms cadence</text>
    </g>
    <g transform="translate(24 518)">
      <rect class="card" width="318" height="106" rx="14"/>
      <text x="18" y="34" class="card-title">Operational metrics</text>
      <text x="18" y="61" class="card-copy">Throughput, rejection, persistence, delivery,</text>
      <text x="18" y="82" class="card-copy">coalescing, clients and broadcast latency.</text>
    </g>
  </g>

  <g transform="translate(1050 210)">
    <rect class="lane" width="244" height="680" rx="20"/>
    <text x="24" y="38" class="lane-title">4 · Data and delivery</text>
    <g transform="translate(24 72)">
      <rect class="card-store" width="196" height="150" rx="14"/>
      <text x="18" y="34" class="card-title">MongoDB</text>
      <text x="18" y="62" class="card-copy">TelemetryEvent</text>
      <text x="18" y="84" class="card-copy">Alert</text>
      <text x="18" y="116" class="small">unique eventId</text>
      <text x="18" y="136" class="small">truckId + timestamp</text>
    </g>
    <g transform="translate(24 250)">
      <rect class="card-accent" width="196" height="154" rx="14"/>
      <text x="18" y="34" class="card-title">Socket.IO rooms</text>
      <text x="18" y="64" class="small">fleet:update</text>
      <text x="18" y="88" class="small">truck:update</text>
      <text x="18" y="112" class="small">alert:new</text>
      <text x="18" y="136" class="small">system:metrics</text>
    </g>
    <g transform="translate(24 432)">
      <rect class="card" width="196" height="132" rx="14"/>
      <text x="18" y="34" class="card-title">Bounded reads</text>
      <text x="18" y="60" class="card-copy">Chronological history</text>
      <text x="18" y="81" class="card-copy">and time-weighted</text>
      <text x="18" y="102" class="card-copy">compliance analytics.</text>
    </g>
  </g>

  <g transform="translate(1322 210)">
    <rect class="lane" width="206" height="680" rx="20"/>
    <text x="24" y="38" class="lane-title">5 · Operator UI</text>
    <g transform="translate(20 72)">
      <rect class="card-accent" width="166" height="120" rx="14"/>
      <text x="16" y="34" class="card-title">React app</text>
      <text x="16" y="61" class="card-copy">REST bootstrap +</text>
      <text x="16" y="82" class="card-copy">live room updates.</text>
    </g>
    <g transform="translate(20 216)">
      <rect class="card" width="166" height="274" rx="14"/>
      <text x="16" y="34" class="card-title">Workspace</text>
      <text x="16" y="68" class="card-copy">Overview</text>
      <text x="16" y="98" class="card-copy">Live fleet map</text>
      <text x="16" y="128" class="card-copy">Truck record</text>
      <text x="16" y="158" class="card-copy">Incident center</text>
      <text x="16" y="188" class="card-copy">Compliance</text>
      <text x="16" y="218" class="card-copy">System health</text>
      <text x="16" y="250" class="small">shared selection</text>
    </g>
    <g transform="translate(20 514)">
      <rect class="card" width="166" height="110" rx="14"/>
      <text x="16" y="34" class="card-title">Browser state</text>
      <text x="16" y="61" class="card-copy">Latest 300 chart</text>
      <text x="16" y="82" class="card-copy">points per truck.</text>
    </g>
  </g>

  <path class="flow-hot" d="M 322 330 C 336 330 336 330 350 330"/>
  <text x="326" y="312" class="flow-label">batch</text>
  <path class="flow-hot" d="M 628 340 C 642 340 642 340 656 340"/>
  <text x="630" y="322" class="flow-label">valid</text>
  <path class="flow-store" d="M 1022 640 C 1034 640 1038 360 1050 360"/>
  <text x="1006" y="504" class="flow-label">persist</text>
  <path class="flow-hot" d="M 1022 640 C 1034 640 1038 540 1050 540"/>
  <text x="1006" y="598" class="flow-label">emit</text>
  <path class="flow-hot" d="M 1294 540 C 1308 540 1308 340 1322 340"/>
  <text x="1294" y="430" class="flow-label">live</text>
  <path class="flow" d="M 1294 740 C 1308 740 1308 710 1322 710"/>
  <text x="1292" y="766" class="flow-label">REST</text>
  <path class="flow-dash" d="M 1322 778 C 1240 920 470 936 470 726"/>
  <text x="810" y="944" class="flow-label">authenticated actions and bounded queries</text>

  <g transform="translate(72 925)">
    <rect width="11" height="11" rx="3" fill="#86aedc"/><text x="20" y="11" class="flow-label">live / control path</text>
    <rect x="174" width="11" height="11" rx="3" fill="#78a292"/><text x="194" y="11" class="flow-label">durable data path</text>
    <text x="430" y="11" class="flow-label">Independent persistence and broadcast paths keep ingestion responsive.</text>
  </g>
</svg>
